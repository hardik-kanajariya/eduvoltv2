[program:eduvolt-queue-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --memory=512 --timeout=60 --verbose
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/supervisor/eduvolt-queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supervisor/eduvolt-queue-worker-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
stopwaitsecs=3600
startsecs=10
priority=999

[program:eduvolt-queue-high-priority]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=high,default --sleep=1 --tries=3 --max-time=1800 --memory=512 --timeout=120 --verbose
directory=/var/www/html
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/eduvolt-queue-high-priority.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=10
stderr_logfile=/var/log/supervisor/eduvolt-queue-high-priority-error.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=10
stopwaitsecs=1800
startsecs=10
priority=998

# To apply these configurations:
# 1. Copy this file to /etc/supervisor/conf.d/eduvolt-queue-workers.conf
# 2. Run: sudo supervisorctl reread
# 3. Run: sudo supervisorctl update
# 4. Run: sudo supervisorctl start all
# 5. Check status: sudo supervisorctl status